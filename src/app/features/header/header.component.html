<header class="sticky top-0 z-40 w-full border-b border-slate-300/80 glass-nav px-4 sm:px-6 py-3 sm:py-3.5 shadow-sm transition-all duration-300 relative">
  
  <!-- Global Scroll Reading Progress Bar (Fixed on Top of Sticky Header) -->
  <div class="absolute top-0 left-0 right-0 w-full h-[2.5px] bg-slate-200/60 overflow-hidden pointer-events-none z-50">
    <div
      class="h-full bg-gradient-to-r from-sky-500 via-sky-600 to-blue-600 shadow-[0_0_8px_rgba(2,132,199,0.5)] transition-[width] duration-75 ease-out"
      [style.width.%]="scrollProgress()">
    </div>
  </div>

  <div class="max-w-6xl mx-auto flex items-center justify-between">
    
    <!-- Brand / Identity -->
    <a href="#top" (click)="scrollToTop($event)" class="flex items-center group cursor-pointer" aria-label="Go to top of page">
      <!-- Permanent Avatar: always visible -->
      <div class="flex items-center shrink-0 mr-3">
        <img [src]="hero().avatarUrl" [alt]="hero().linkedInDisplayName" class="w-9 h-9 rounded-xl object-cover ring-2 ring-sky-500/70 shadow-sm">
      </div>
      <div>
        <span class="font-bold text-base tracking-tight text-slate-900 group-hover:text-sky-600 transition">{{ hero().linkedInDisplayName }}</span>
        <span class="hidden sm:inline-block text-xs text-slate-500 font-mono-code ml-2">{{ hero().subtitle }}</span>
      </div>
    </a>

    <!-- Main Desktop Nav Links with Icons & Underline Progress Indicator -->
    <nav class="hidden md:flex items-center gap-5 lg:gap-6 text-sm font-semibold text-slate-600">
      @for (link of navLinks(); track link.id) {
        <a [href]="'#' + link.id" class="nav-item group relative py-1 px-1 flex items-center gap-1.5 transition-colors">
          <app-icon [name]="link.icon" cssClass="w-4 h-4 text-slate-400 group-hover:text-sky-600 transition-colors"></app-icon>
          <span>{{ link.label }}</span>
          <span class="nav-underline"></span>
        </a>
      }
    </nav>

    <!-- Right Quick Actions (Responsive Hamburger on Mobile) -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <!-- Mobile Hamburger Menu Button -->
      <button (click)="toggleMobileMenu()" class="md:hidden p-1.5 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition" aria-label="Toggle Menu">
        @if (!mobileMenuOpen()) {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Navigation Drawer with Icons -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden pt-3 pb-2 border-t border-slate-200/80 mt-3 space-y-1">
      @for (link of navLinks(); track link.id) {
        <a [href]="'#' + link.id" (click)="closeMobileMenu()" class="mobile-nav-item flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm font-semibold text-slate-700 hover:bg-sky-50 hover:text-sky-700 transition">
          <app-icon [name]="link.icon" cssClass="w-4 h-4 text-slate-400 shrink-0 transition-colors"></app-icon>
          <span>{{ link.label }}</span>
        </a>
      }
    </div>
  }
</header>
